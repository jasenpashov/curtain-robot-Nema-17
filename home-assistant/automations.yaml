# --- Daylight automations --------------------------------------------------
# Driven by an outdoor lux sensor. The five-minute `for` stops a passing cloud
# or a car headlight from triggering anything.
#
# Note that each curtain is checked inside the actions, not in the conditions.
# A condition at the top would abort the whole automation when the first
# curtain is already in the target state, and the second would never move.

- alias: Curtains - Auto Close in Bright Sun
  description: Close each curtain that is open when it gets bright outside
  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.outdoor_light
      above: 30000
      for:
        hours: 0
        minutes: 5
        seconds: 0
  conditions: []
  actions:
    - if:
        - condition: state
          entity_id: cover.curtain_left
          state: open
      then:
        - action: cover.close_cover
          target:
            entity_id: cover.curtain_left
    - if:
        - condition: state
          entity_id: cover.curtain_right
          state: open
      then:
        - action: cover.close_cover
          target:
            entity_id: cover.curtain_right
  mode: single


- alias: Curtains - Auto Open at Dusk
  description: Open each curtain that is closed when it gets dark outside
  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.outdoor_light
      below: 2400
      for:
        hours: 0
        minutes: 5
        seconds: 0
  conditions: []
  actions:
    - if:
        - condition: state
          entity_id: cover.curtain_left
          state: closed
      then:
        - action: cover.open_cover
          target:
            entity_id: cover.curtain_left
    - if:
        - condition: state
          entity_id: cover.curtain_right
          state: closed
      then:
        - action: cover.open_cover
          target:
            entity_id: cover.curtain_right
  mode: single
