# =============================================================================
#  Home Assistant automations for the curtain robot
#
#  Before using these, replace:
#    - the cover entity ids with your own
#    - the MQTT topic and payloads with what your remote actually sends
#      (listen to the topic in Developer Tools > MQTT and press each button;
#       remotes often label buttons differently from the action strings)
#    - the lux sensor entity id
# =============================================================================


# --- Remote control --------------------------------------------------------
# Each button toggles: press once to move, press again to stop.
# The test is on the cover's own state, so no extra "is moving" sensor is needed.

- alias: Curtain Left - Open or Stop
  description: Stop if moving, otherwise open
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/ZigBee Remote Control
      value_template: '{{ value_json.action | default('''') }}'
      payload: 1_single
  conditions: []
  actions:
    - if:
        - condition: state
          entity_id: cover.curtain_left
          state:
            - opening
            - closing
      then:
        - action: cover.stop_cover
          target:
            entity_id: cover.curtain_left
      else:
        - action: cover.open_cover
          target:
            entity_id: cover.curtain_left
  mode: single
  max_exceeded: silent


- alias: Curtain Left - Close or Stop
  description: Stop if moving, otherwise close
  triggers:
